<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المطاعم | Zemarix</title><style>body{font-family:Tahoma,Arial,sans-serif;background:#17111d;color:#fff1db;margin:0;padding:25px}main{max-width:940px;margin:auto}a{color:#ffe0a2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#2a1d2d;padding:25px;border:1px solid #795766;border-radius:20px}.card a{font-size:21px;font-weight:bold}.muted{color:#d3bdc7}</style></head><body><main><p><a href="/">← DI Commerce Egypt</a></p><h1>مطاعم Zemarix</h1><p class="muted">بيئات استعراض مستقلة. الطلبات المعروضة في هذه النسخة تجريبية ولا تصل لأي مطعم حقيقي.</p><div class="grid">{% for t in tenants %}<article class="card"><h2>{{ t.name }}</h2><a href="/r/{{ t.slug }}">فتح منيو {{ t.name }} ←</a></article>{% else %}<p>لم تُضف مطاعم إلى النظام بعد. يستطيع مدير المنصة إنشاء مطعم من لوحة الإدارة.</p>{% endfor %}</div></main></body></html>
