<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول {{ tenant.name }}</title><style>body{background:#160e1c;color:#ffe9d2;font-family:Tahoma,Arial,sans-serif;margin:0;display:grid;place-items:center;min-height:100vh}.card{background:#261b2c;border:1px solid #a16b83;border-radius:22px;padding:35px;max-width:440px;width:calc(100% - 40px)}form{display:grid;gap:15px}input,button{font:inherit;padding:15px;border-radius:9px}input{color:white;background:#160e1c;border:1px solid #8b5d70}button{background:#f6cf91;font-weight:900;border:0;cursor:pointer}a{color:#ffda92}.error{color:#ff9696}</style></head><body><main class="card"><p><a href="/r/{{ tenant.slug }}">← منيو المطعم</a></p><h1>إدارة {{ tenant.name }}</h1>{% if error %}<p class="error">كلمة المرور غير صحيحة.</p>{% endif %}<form method="post"><label>كلمة مرور مدير المطعم<input type="password" name="password" required autocomplete="current-password"></label><button>دخول لوحة المطعم</button></form><p>كلمة مرور هذا المطعم مستقلة عن باقي المطاعم.</p></main></body></html>
