name: DI Commerce checks
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'feature/**'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest tests -q
      - run: node --check static/customer.js
      - run: node --check static/i18n.js
